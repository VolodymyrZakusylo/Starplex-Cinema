name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore StarPlex.sln

      - name: Build solution
        run: dotnet build StarPlex.sln -c Release --no-restore

      - name: Test
        run: dotnet test StarPlex.sln -c Release --no-build --logger trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: '**/*.trx'

  frontend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t frontend-ci --build-arg NGINX_CONFIG=nginx.prod.conf .

      - name: Verify nginx configuration
        run: |
          docker run --rm frontend-ci cat /etc/nginx/conf.d/default.conf > nginx_config.txt || { echo "Failed to extract config"; exit 1; }
          if grep -q "http://api:8080" nginx_config.txt; then
            echo "Error: nginx configuration contains http://api:8080"
            exit 1
          fi
          docker run --rm frontend-ci nginx -t || { echo "Nginx config test failed"; exit 1; }
